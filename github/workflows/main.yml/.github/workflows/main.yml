name: Build APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.9
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool libltdl-dev libffi-dev libssl-dev zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libbz2-dev libexpat1-dev liblzma-dev libstdc++6 zlib1g-dev python3 python3-dev
        pip install --upgrade pip
        pip install Cython==0.29.33
        pip install buildozer
    - name: Build with Buildozer
      run: |
        buildozer android debug
    - name: Upload Artifact
      uses: actions/upload-artifact@v2
      with:
        name: package
        path: bin/*.apk
